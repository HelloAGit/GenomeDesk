# Deploy only the frontend; the existing FastAPI service stays unchanged.
# Public demo: no browser login. The backend remains protected by X-API-Key,
# which is injected server-side by the Next.js proxy.
services:
  - type: web
    name: genomedesk-web
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: GENOMEDESK_API_URL
        value: https://genomedesk.onrender.com
      - key: GENOMEDESK_BACKEND_KEY
        sync: false
